name: Agent Createur

on:
  workflow_dispatch:        # bouton "Run workflow" (lancement manuel)
  schedule:
    - cron: "17 8 * * *"    # 1 fois par jour, 08h17 UTC (minute décalée = moins de retards GitHub)

# Droits minimaux : ce workflow peut seulement LIRE le dépôt
permissions:
  contents: read

# Jamais deux exécutions en même temps
concurrency:
  group: agent-createur
  cancel-in-progress: false

jobs:
  generer-contenu:
    runs-on: ubuntu-latest
    timeout-minutes: 5      # coupe automatiquement si ça bloque (protège tes minutes)
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer l'agent Créateur
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE: "Produits"
          GROQ_MODELS: ${{ vars.GROQ_MODELS }}   # optionnel : voir le guide
        run: python agent_createur.py
